services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vehicleapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-vehicledb}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vehicleapp -d vehicledb"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://vehicleapp:change-me@postgres:5432/vehicledb
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  vehicle-simulator:
    build: ./virtual_ecu
    environment:
      API_URL: http://backend:8000
      VEHICLE_ID: VEH-1001
      INTERVAL_SECONDS: 2
    depends_on:
      - backend

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
